  const c=[...document.querySelectorAll('#app .item,#app .cc,#app .card')].filter(el=>el.textContent.includes(h.t)&&(!need||!ds||el.textContent.includes(ds)));
  const el=c.find(e=>e.classList.contains('item'))||c.sort((a,b)=>a.textContent.length-b.textContent.length)[0];
  if(el){el.scrollIntoView({block:'center',behavior:'smooth'});el.classList.add('hl');setTimeout(()=>el.classList.remove('hl'),2800)}}
const acctName=id=>{const b=items.find(i=>i.id===id&&i.t==='bank');return b?(b.bank+(b.name?' '+b.name:'')):''};
const acctOpts=(sel,ph)=>`<option value="">${ph||'\u2014'}</option>`+items.filter(i=>i.t==='bank'&&(!scope()||!i.who||i.who===scope()||i.who==='Bersama')).map(b=>`<option value="${b.id}"${b.id===sel?' selected':''}>${esc(b.bank+(b.name?' \u00b7 '+b.name:''))}${b.who?' ('+esc(b.who)+')':''}</option>`).join('');
function acctMoves(id){const b=items.find(i=>i.id===id);if(!b)return[];const from=b.bdate||'',ok=d=>!from||(d||'')>=from,M=[];
  items.filter(i=>i.t==='inc').forEach(x=>{
    if(x.acct===id&&ok(x.date)&&x.date<=TODAY)M.push({d:x.date,l:'Income \u00b7 '+tt(x),a:+x.amt||0});
    (x.al||[]).forEach(z=>{if(!z.ok)return;const src=z.from||x.acct,d=z.d||x.date;if(!ok(d))return;
      if(src===id)M.push({d,l:'Allocated \u00b7 '+z.n,a:-(+z.amt||0)});
      if(z.to===id)M.push({d,l:'Transfer in \u00b7 '+z.n,a:+z.amt||0})})});
  items.filter(i=>i.t==='exp'&&i.acct===id&&i.done&&ok(i.date)).forEach(x=>M.push({d:x.date,l:'Expense \u00b7 '+tt(x),a:-(+x.amt||0)}));
  return M.sort((a,c)=>c.d.localeCompare(a.d))}
const acctBal=b=>(b.bal==null||b.bal==='')?null:(+b.bal||0)+acctMoves(b.id).reduce((s,m)=>s+m.a,0);
function banks(){
  const b=by('bank'),grp={Ayah:[],Bunda:[],Shared:[]};b.forEach(x=>grp[x.who==='Ayah'||x.who==='Bunda'?x.who:'Shared'].push(x));
  const tot=l=>l.reduce((s,x)=>s+(acctBal(x)||0),0),T=tot(b),own=[...new Set(b.map(x=>x.owner))];
  const card=x=>{const c=BK[x.bank]||['#6b7280',(x.bank||'?').slice(0,3),'#fff'],bl=acctBal(x),mv=acctMoves(x.id).slice(0,6);
    return `<div class="cc"><div class="row between" style="flex-wrap:nowrap"><div class="row" style="flex-wrap:nowrap">${BI[x.bank]?`<div style="width:64px;height:40px;border:1px solid var(--bd);border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;padding:4px;flex:none"><img src="${BI[x.bank]}" alt="${esc(x.bank)}" style="max-width:100%;max-height:100%;object-fit:contain"></div>`:`<div style="width:40px;height:40px;border-radius:12px;background:${c[0]};color:${c[2]};display:flex;align-items:center;justify-content:center;font-weight:800;font-size:${c[1].length>2?11:16}px;flex:none">${esc(c[1])}</div>`}<div><b>${esc(x.bank)}</b>${x.name?`<span class="tag">${esc(x.name)}</span>`:''}<div class="mu">${esc(x.owner)}</div></div></div><span class="row" style="flex-wrap:nowrap;gap:6px"><button class="btn ghost" data-a="del" data-id="${x.id}">Delete</button></span></div>
    <div class="row between" style="margin-top:8px;flex-wrap:nowrap"><b style="font-size:15px;letter-spacing:.05em;font-variant-numeric:tabular-nums">${esc(fmtNo(x.no))}</b><button class="btn ghost" data-a="copy" data-v="${esc(String(x.no).replace(/\D/g,''))}" style="padding:4px 10px">Copy</button></div>
    <div class="row between" style="margin-top:6px;flex-wrap:nowrap"><span class="mu">Balance</span>${bl==null?'<span class="mu">not set \u00b7 tap Edit to set it</span>':`<b style="font-size:17px" class="${bl<0?'neg':''}">${rp(bl)}</b>`}</div>
    ${mv.length?`<details style="margin-top:4px"><summary class="mu" style="cursor:pointer;font-size:12px">Recent movements</summary>${mv.map(m=>`<div class="row between mu" style="flex-wrap:nowrap;font-size:12px"><span>${dt(m.d)} \u00b7 ${esc(m.l)}</span><b class="${m.a>0?'pos':'neg'}">${m.a>0?'+':'-'}${rp(Math.abs(m.a))}</b></div>`).join('')}</details>`:''}</div>`};
  const sec=(t,l,c)=>l.length?`<h3 style="margin:12px 0 6px;color:${c}">${t} \u00b7 ${rp(tot(l))}</h3><div class="g2c">${l.map(card).join('')}</div>`:'';
  return eyeRow()+`<div class="cg">${kpi2('Total balance',rp(T),b.filter(x=>acctBal(x)!=null).length+' of '+b.length+' accounts')}${kpi2('Ayah',rp(tot(grp.Ayah)),'',BL)}${kpi2('Bunda',rp(tot(grp.Bunda)),'',PK)}${kpi2('Shared / unassigned',rp(tot(grp.Shared)))}</div>
  <div class="card form" data-f="bank"><select name="bank">${opts([...Object.keys(BK),'Other'])}</select><input name="no" inputmode="numeric" placeholder="Account number"><input name="owner" list="dlo" placeholder="Account holder">${dl('dlo',own)}<input name="name" placeholder="Purpose (General, Emergency Fund\u2026)">${WHO}<input name="bal" type="number" inputmode="numeric" placeholder="Current balance (optional)"><button class="btn" data-a="add" data-t="bank">Add account</button></div>
  ${sec('Ayah',grp.Ayah,BL)}${sec('Bunda',grp.Bunda,PK)}${sec('Shared / unassigned',grp.Shared,'var(--mu)')}${b.length?'':empty('No accounts yet')}`;
}
const MONEY_SKIP=/^(pct|sisa|p2|p3|e2|e3|e4|tplpct|mf_pct|mf_sisa)$/;
function fixNums(root){(root||document).querySelectorAll('input[type=number]').forEach(i=>{const k=i.name||i.id||i.dataset.a||'';if(MONEY_SKIP.test(k))return;i.type='text';i.inputMode='numeric';i.dataset.money='1';i.autocomplete='off'})}
document.addEventListener('input',e=>{const t=e.target;if(t&&t.dataset&&t.dataset.money){const c=t.value.replace(/[^\d-]/g,'').replace(/(?!^)-/g,'');if(c!==t.value){const p=Math.max(0,(t.selectionStart||0)-(t.value.length-c.length));t.value=c;try{t.setSelectionRange(p,p)}catch(_){}}}});
function render(){
  {const e=$('#eye');if(e){e.textContent=hide?'🙈':'👁️';e.setAttribute('aria-label',hide?'Show amounts':'Hide amounts')}}
  document.body.dataset.room=room||'';document.body.dataset.tab=MAIN.includes(room)?'':tab;
  $('#rooms').innerHTML=[['Ringkasan','📊 Summary'],['Ayah','👨 Ayah'],['Bunda','👩 Bunda'],['Subscription','🔁 Subscriptions'],['Rekening','🏦 Accounts']].map(([r,l])=>`<button class="room ${room===r?'on':''}" data-v="${r}" data-a="room">${l}</button>`).join('')+'<button class="room" data-a="search" title="Search" aria-label="Search" style="margin-left:auto">🔍</button>';
  $('#nav').innerHTML=room==='Ringkasan'?'':TABS.map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}">${l}</button>`).join('');
  if(!col){gateView();return}
  if(!ready){$('#app').innerHTML=empty('Loading data…');return}
  $('#app').innerHTML=room==='Rekening'?banks():room==='Subscription'?subsc():room==='Ringkasan'?home():{home,exp:expense,inc:income,goal:goalTab,inv:invest,cal:kal}[tab]();
  if(!MAIN.includes(room)){if(tab==='goal'&&subs.goal==='edu')calc();if(tab==='inv')proj()}addEdit();prettyForms();fixNums($('#app'));if(hl){const h=hl;hl=null;setTimeout(()=>flash(h),80)}
}
const save=(id,patch)=>{const x=items.find(i=>i.id===id);if(!x)return;const{id:_,...d}=x;return col.doc(id).set({...d,...patch}).catch(()=>alert('Could not save. Please make sure you have edit access.'))};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b||b.tagName==='SELECT')return;const a=b.dataset.a,v=b.dataset.v,id=b.dataset.id,x=items.find(i=>i.id===id);
  if(a==='tab'){tab=v;render()}
  else if(a==='shift'){shift(+v);render()}
  else if(a==='who'){fw=v;render()}
  else if(a==='calc'){calc()}
  else if(a==='search'){openSearch()}
  else if(a==='sgo'){goSearch(+b.dataset.i)}
  else if(a==='eye'){hide=!hide;try{localStorage.setItem('hide',hide?'1':'0')}catch(err){}render()}
  else if(a==='edit'){openEdit(id,b.dataset.i!==undefined?+b.dataset.i:undefined)}
  else if(a==='cp'){copyPrev(v)}
  else if(a==='xport'){exportData(v)}
  else if(a==='nwsnap'){const n=nwStat(),sc=scope()||'all';col.doc('nws_'+sc+'_'+cur).set({t:'nws',sc,ym:cur,date:TODAY,amt:n.A-n.D}).then(()=>alert('Snapshot saved for '+mlabel()+'.')).catch(()=>alert('Could not save.'))}
  else if(a==='proj'){proj()}
  else if(a==='copy'){try{navigator.clipboard.writeText(v)}catch(err){}b.textContent='Copied ✓';setTimeout(()=>{b.textContent='Copy'},1200)}
  else if(a==='room'){room=v;try{localStorage.setItem('room',v)}catch(err){}render()}
  else if(a==='sub'){subs[b.dataset.k]=v;render()}
  else if(a==='dec'){save(id,{sisa:Math.max(0,x.sisa-1)})}
  else if(a==='opn'){openId=openId===id?null:id;render()}
  else if(a==='aladd'){const n=$('#an'+id).value,d=$('#ad'+id).value,m=+$('#aa'+id).value;if(n&&m)save(id,{al:[...(x.al||[]),{n,d,amt:m,ok:false,ct:$('#ac'+id).value,to:$('#at'+id).value}]})}
  else if(a==='alct'){save(id,{al:x.al.map((z,i)=>i===+b.dataset.i?{...z,ct:(z.ct||'Fixed')==='Fixed'?'Variable':'Fixed'}:z)})}
  else if(a==='aldel'){save(id,{al:x.al.filter((_,i)=>i!==+b.dataset.i)})}
  else if(a==='altpl'){if(x.al&&x.al.length&&!confirm('Replace the current allocations with your template?'))return;save(id,{al:tplOf(x.who).map(t=>({n:t.name,d:x.date,amt:Math.round(x.amt*t.pct/100),ok:false,ct:t.ct||'Fixed'}))})}
  else if(a==='adet'){const n=$('#dn'+id).value,m=+$('#da'+id).value;if(n&&m)save(id,{det:[...(x.det||[]),{n,a:m}]})}
  else if(a==='ddet'){save(id,{det:x.det.filter((_,i)=>i!==+b.dataset.i)})}
  else if(a==='del'){if(confirm('Delete this item?'))col.doc(id).delete().catch(()=>alert('Could not delete.'))}
  else if(a==='setor'){const n=+$('#s'+id).value;if(n)save(id,{saved:(+x.saved||0)+n})}
  else if(a==='upv'){const n=+$('#v'+id).value||0;save(id,{val:n,hist:[...(x.hist||[]).filter(h=>h.d!==TODAY),{d:TODAY,v:n}]})}
  else if(a==='add'){
    const f=b.closest('[data-f]'),d={t:b.dataset.t};
    f.querySelectorAll('input,select').forEach(i=>d[i.name]=(i.type==='number'||i.dataset.money)?(+i.value||0):i.value);
    if(!(d.name||d.title||d.no)){alert('Please fill in the name or title first.');return}
    if(d.t==='ev')d.yearly=!!d.yearly;
    if((d.t==='exp'||d.t==='inc')&&!d.amt){alert('Please enter an amount first.');return}
    if(d.sisa===0)delete d.sisa;
    if(d.t==='inv')d.hist=[{d:TODAY,v:d.val}];
    if(d.t==='bank'){const bi=f.querySelector('[name=bal]');if(bi&&bi.value==='')delete d.bal;else d.bdate=TODAY}
    if(scope())d.who=scope();
    col.add(d).catch(()=>alert('Could not save. Please make sure you have edit access.'));
  }
});
document.addEventListener('change',e=>{const t=e.target,s=t.closest('select[data-a="stat"]');if(s)save(s.dataset.id,{status:s.value});
  const c=t.closest('input[data-a="paid"]'),xp=t.closest('input[data-a="xpaid"]'),ac=t.closest('input[data-a="alchk"]');
  if(c){const x=items.find(i=>i.id===c.dataset.id);save(c.dataset.id,{paid:{...(x.paid||{}),[cur]:c.checked}})}
  if(xp)save(xp.dataset.id,{done:xp.checked});
  const bl=t.closest('input[data-a="budlim"]');if(bl)save(bl.dataset.id,{lim:+bl.value||0});
  const tn=t.closest('input[data-a="tplname"]'),tq=t.closest('input[data-a="tplpct"]');if(tn)save(tn.dataset.id,{name:tn.value});if(tq)save(tq.dataset.id,{pct:+tq.value||0});
  if(ac){const x=items.find(i=>i.id===ac.dataset.id);save(ac.dataset.id,{al:x.al.map((z,i)=>i===+ac.dataset.i?{...z,ok:ac.checked}:z)})}});
let authUser=null,unsub=null;
(function boot(){
  render();
  if(!configured){return}
  const app=initializeApp(firebaseConfig),auth=getAuth(app),fs=getFirestore(app),C=collection(fs,'fin');
  window.fbSignIn=()=>signInWithPopup(auth,new GoogleAuthProvider()).catch(e=>{gateMsg='Sign-in did not finish ('+(e.code||'error')+'). Please try again.';render()});
  window.fbSignOut=()=>signOut(auth);
  $('#so').onclick=e=>{e.preventDefault();signOut(auth)};
  document.addEventListener('change',async e=>{if(e.target.id!=='impf')return;const f=e.target.files[0];if(!f)return;
    try{const arr=JSON.parse(await f.text());if(!Array.isArray(arr))throw 0;const rows=arr.filter(x=>x&&x.id&&x.t);
      if(!confirm('Import '+rows.length+' items? Items with the same ID will be overwritten.'))return;
      for(let i=0;i<rows.length;i+=400){const b=writeBatch(fs);rows.slice(i,i+400).forEach(({id,...d})=>b.set(doc(fs,'fin',id),d));await b.commit()}
      alert('Import finished: '+rows.length+' items.')}catch(err){alert('Could not import. Please choose the backup (JSON) file downloaded from the app.')}e.target.value=''});
  onAuthStateChanged(auth,u=>{authUser=u;if(unsub){unsub();unsub=null}col=null;ready=false;items=[];gateMsg=u?gateMsg:'';
    if(!u){$('#stat').textContent='Signed out';render();return}
    $('#stat').textContent=u.email;
    col={add:d=>addDoc(C,d),doc:id=>({set:d=>setDoc(doc(fs,'fin',id),d),delete:()=>deleteDoc(doc(fs,'fin',id))})};
    unsub=onSnapshot(C,s=>{items=s.docs.map(d=>({id:d.id,...d.data()}));ready=true;
      const ae=document.activeElement;if(ae&&/INPUT|SELECT/.test(ae.tagName)&&ae.closest('[data-f]'))return;render()},
      err=>{col=null;ready=false;gateMsg='The account '+u.email+' is not allowed to open this planner.';$('#stat').textContent='No access';render()});
    render()});
})();
</script></body></html>
